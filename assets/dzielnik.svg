<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6" viewBox="0 0 900 6" role="img" aria-label="">
  <defs>
    <linearGradient id="bieg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E60000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF2D2D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E60000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ram"><rect width="900" height="6"/></clipPath>
  </defs>
  <style>
    .b { animation: p 3.4s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes p { 0% { transform: translateX(-220px); } 100% { transform: translateX(900px); } }
    @media (prefers-reduced-motion: reduce) { .b { animation: none; } }
  </style>
  <g clip-path="url(#ram)">
    <rect y="2" width="900" height="1" fill="#26262F"/>
    <rect class="b" y="1.6" width="220" height="2" fill="url(#bieg)"/>
  </g>
</svg>
