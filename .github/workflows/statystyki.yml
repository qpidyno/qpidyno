name: Odśwież kartę z liczbami

on:
  schedule:
    # Codziennie o 05:30 UTC (07:30 czasu polskiego latem, 06:30 zimą).
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: statystyki
  cancel-in-progress: false

jobs:
  odswiez:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj zależności
        run: pip install --quiet fonttools brotli

      - name: Przelicz statystyki i odbuduj kartę
        env:
          # STATYSTYKI_TOKEN to token osobisty z uprawnieniami read:user oraz repo.
          # Bez nich GitHub nie poda prywatnych commitów ani prywatnych repozytoriów,
          # więc karta pokazałaby same zera. Szczegóły w narzedzia/README.md.
          GH_TOKEN: ${{ secrets.STATYSTYKI_TOKEN }}
        run: python narzedzia/generuj.py --statystyki

      - name: Zacommituj, jeśli liczby się zmieniły
        run: |
          if [ -z "$(git status --porcelain assets/statystyki.svg)" ]; then
            echo "Liczby bez zmian - nic do zrobienia."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/statystyki.svg
          git commit -m "chore: odświeżenie karty z liczbami"
          git push
